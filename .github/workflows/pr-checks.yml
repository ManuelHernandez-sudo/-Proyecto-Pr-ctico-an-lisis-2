name: PR checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar nombre de rama y AB# en el PR
        env:
          HEAD: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$HEAD" | grep -Eq '^(feature|fix|refactor|docs|dependabot)/' || { echo "Rama inválida: $HEAD"; exit 1; }
          if ! echo "$HEAD" | grep -Eq '^dependabot/'; then
            echo "$TITLE $BODY" | grep -Eq 'AB#[0-9]+' || { echo "Falta AB#ID en título o descripción"; exit 1; }
          fi
