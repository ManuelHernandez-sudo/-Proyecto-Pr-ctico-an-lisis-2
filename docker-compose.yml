services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident-local}
      POSTGRES_DB: ${POSTGRES_DB:-incidenthub}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-incident-local}@db:5432/${POSTGRES_DB:-incidenthub}
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_API_URL: http://localhost:${API_PORT:-3000}/api
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on: [api]
volumes:
  pgdata:
